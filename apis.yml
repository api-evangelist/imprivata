aid: imprivata
name: Imprivata
description: >-
  Imprivata is a digital identity and access management company built for
  healthcare and other mission-critical industries. Its platform delivers
  passwordless and multifactor authentication, single sign-on (Enterprise Access
  Management, formerly OneSign), privileged access management, mobile and shared
  device access (Mobile Access Management, formerly GroundControl), and drug
  enforcement e-prescribing (DEA-EPCS) workflows so that clinicians, partners,
  and increasingly AI agents can securely access systems and data without
  slowing down crucial work. Imprivata exposes integration surfaces for software
  and hardware vendors through the OneSign ProveID Web API and ProveID SDK and a
  Privileged Access Management REST API, governed through its Access Management
  Partner (developer) program. These APIs are deployed on customer/instance
  infrastructure rather than a single public cloud host, so Imprivata publishes
  integration documentation and a developer partner program rather than a hosted
  public API portal.
